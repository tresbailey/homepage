<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 Video Autoplayer</title>
</head>
<body>

  <button id="startBtn" style="font-size:1.5rem; padding:1rem 2rem;">Start Video</button>
  <video id="player" controls style="display:none; width:100%;"></video>
<script>
const BUCKET_NAME = "tresback.com";
const PREFIX = "videos/turkey-25/";

const params = new URLSearchParams(window.location.search);
const filename = params.get("file");
const presigned = params.get("url");

let videoUrl = null;
let hlsInstance = null;

// Build URL but DO NOT assign player.src yet
if (presigned) {
  videoUrl = presigned;
} else if (filename) {
  videoUrl = `https://s3.amazonaws.com/${BUCKET_NAME}/${PREFIX}${filename}`;
} else {
  console.error("No 'file' or 'url' provided.");
}

// HLS helper
function loadVideo(url) {
  if (url.endsWith(".m3u8")) {
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(player);
    } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
      player.src = url; // Safari
    } else {
      console.error("HLS not supported");
    }
  } else {
    player.src = url; // MP4
  }
}

startBtn.addEventListener("click", async () => {
  startBtn.style.display = "none";

  // Load video NOW (AFTER user gesture)
  loadVideo(videoUrl);

  player.style.display = "block";

  // Wait a brief moment for HLS to attach before playing
  setTimeout(async () => {
    try {
      await player.play();
    } catch (err) {
      console.warn("Playback error:", err);
    }


    // Fullscreen + orientation (best attempt)
    try {
      if (player.requestFullscreen) {
        await player.requestFullscreen();
      }
      if (screen.orientation?.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch (err) {
      console.warn("Fullscreen/orientation failed:", err);
    }
  }, 200);
});

</script>
</body>
</html>
